name: Build Snipster Flutter App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Generate Android & Platform Scaffolding
        run: |
          cd aplikasi
          flutter create . --org com.snipster --project-name snipster

      - name: Configure Android minSdkVersion for video_player
        run: |
          cd aplikasi
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion 16/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion 19/minSdkVersion 21/g' android/app/build.gradle || true

      - name: Install Dependencies
        run: |
          cd aplikasi
          flutter pub get

      - name: Build Android APK
        run: |
          cd aplikasi
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snipster-release-apk
          path: aplikasi/build/app/outputs/flutter-apk/app-release.apk
